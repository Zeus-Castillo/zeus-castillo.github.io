<title>Zeus Castillo · Automation Engineer</title>
<meta name="description" content="Zeus Castillo, ingeniero de automatización freelance en Málaga. Automatizo procesos: software PLC, supervisión, comunicaciones industriales y puesta en marcha. España, Francia y Suiza.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<meta property="og:title" content="Zeus Castillo · Automation Engineer">
<meta property="og:description" content="Freelance automation engineer based in Málaga. PLC software, user interfaces and communication between systems, from design to commissioning.">
<meta property="og:type" content="profile">
<meta property="og:url" content="https://zeuscastillo.com/">

<style>
:root{
  color-scheme:light;
  --bg:#F5F5F7; --surface:#FFFFFF; --alt:#FAFAFA; --ink:#1D1D1F; --soft:#424245; --muted:#6E6E73; --line:#D2D2D7; --hair:#E8E8ED;
  --brass:#C9A24D; --brass-strong:#A5802F; --brass-text:#8A6A22; --ok:#248A3D;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Geist","Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Geist","Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono","Geist Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px;background:var(--bg)}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
a{color:inherit}
::selection{background:#EAD9AE;color:var(--ink)}
:focus-visible{outline:2px solid var(--brass-strong);outline-offset:3px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:24px}
@media (max-width:520px){.wrap{padding-inline:16px}}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(245,245,247,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
.bar .wrap{display:flex;align-items:center;gap:24px;height:52px}
.mark{text-decoration:none;font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-.02em;color:var(--brass-strong)}
.nav{display:flex;gap:26px;margin-left:auto}
.nav a{text-decoration:none;font-size:13px;color:var(--ink);opacity:.8}
.nav a:hover{opacity:1;color:var(--brass-text)}
.langs{display:flex;background:#E8E8ED;border-radius:8px;padding:2px;gap:2px}
.langs button{font:500 12px/1 var(--body);background:none;border:0;color:var(--soft);padding:6px 10px;border-radius:6px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media (max-width:820px){.nav{display:none}.langs{margin-left:auto}}

/* hero */
.hero{padding-block:72px 80px;display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:start}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding-block:44px 56px;gap:40px}}
.eyebrow{font:600 14px/1.4 var(--body);letter-spacing:0;color:var(--brass-text);margin:0 0 10px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(42px,5.4vw,64px);line-height:1.05;letter-spacing:-.025em;margin:0 0 22px;text-wrap:balance}
h1 em{font-style:normal;color:var(--brass-strong)}
.lede{font-size:21px;line-height:1.45;max-width:34em;margin:0 0 30px;color:var(--soft);letter-spacing:-.015em}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;font:500 17px/1 var(--body);padding:13px 24px;border-radius:980px;text-decoration:none;cursor:pointer;border:1px solid var(--brass-strong);color:var(--brass-text);background:none}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.btn.primary:hover{background:#D3AE5C}
.facts{display:flex;flex-wrap:wrap;gap:8px 24px;margin:36px 0 0;padding:0;list-style:none;font-size:15px;color:var(--muted)}
.facts li strong{color:var(--ink);font-weight:600}

/* profile + activity */
.side-card{display:flex;flex-direction:column;gap:20px}
.who{display:flex;align-items:center;gap:18px}
.who img{width:104px;height:104px;object-fit:cover;border-radius:50%;flex:none;box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--brass),0 8px 24px rgba(0,0,0,.12)}
.who strong{display:block;font-family:var(--display);font-weight:600;font-size:26px;line-height:1.1;letter-spacing:-.02em}
.who span{display:block;color:var(--muted);font-size:15px}
.activity{background:var(--surface);border-radius:18px;box-shadow:0 2px 12px rgba(0,0,0,.06);overflow:hidden}
.activity-head{padding:16px 20px 10px;font:600 13px/1.3 var(--body);color:var(--muted)}
.activity ol{list-style:none;margin:0;padding:0 20px 6px}
.act{padding:14px 0;border-top:1px solid var(--hair)}
.act .org{display:block;font:600 11px/1.4 var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--brass-text);margin-bottom:2px}
.act h3{font-size:16px;font-weight:600;line-height:1.3;margin:0}
.act p{margin:3px 0 8px;font-size:14px;color:var(--muted);line-height:1.45}
.status{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--body);padding:5px 10px;border-radius:980px;color:var(--ok);background:#E7F4EA}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.status.done{color:var(--brass-text);background:#F6EEDB}
.status.ongoing{color:var(--soft);background:#EDEDF0}
.status.ongoing::before{background:none;border:1.5px solid currentColor;width:4px;height:4px}
.links{display:flex;flex-wrap:wrap;gap:6px 20px}

/* sections */
section{padding-block:88px}
section:nth-of-type(odd){background:var(--surface)}
@media (max-width:520px){section{padding-block:56px}}
.sec-head{max-width:760px;margin-bottom:44px}
@media (max-width:820px){.sec-head{margin-bottom:28px}}
h2{font-family:var(--display);font-weight:600;font-size:clamp(34px,4.4vw,48px);line-height:1.08;letter-spacing:-.025em;margin:0;text-wrap:balance}
.sec-intro{color:var(--soft);font-size:19px;line-height:1.5;max-width:40em;margin:14px 0 0}

/* card base */
.svc,.prj{background:var(--surface);border-radius:18px;padding:28px}
section:nth-of-type(odd) .svc,section:nth-of-type(odd) .prj{background:var(--bg)}

/* services */
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.services{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.services{grid-template-columns:1fr}}
.svc{display:flex;flex-direction:column;gap:8px}
.svc .code{font:600 12px/1.3 var(--body);color:var(--brass-text);letter-spacing:.02em}
.svc h3{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.15;letter-spacing:-.02em;margin:0}
.svc p{margin:0;color:var(--muted);font-size:16px}

/* projects */
.projects{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
@media (max-width:760px){.projects{grid-template-columns:1fr}}
.prj{display:flex;flex-direction:column;gap:10px;scroll-margin-top:80px}
.prj-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font:500 13px/1.3 var(--body);color:var(--muted)}
.prj-meta .sector{color:var(--brass-text);font-weight:600}
.prj h3{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.12;letter-spacing:-.022em;margin:0;text-wrap:balance}
.prj p{margin:0;font-size:16px;color:var(--soft)}
.prj .more{font-size:16px;color:var(--brass-text);text-decoration:none;align-self:flex-start}
.prj .more:hover{text-decoration:underline}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:auto 0 0;padding:6px 0 0;list-style:none}
.tags li{font:500 12px/1 var(--body);padding:6px 10px;border-radius:980px;color:var(--soft);background:#E8E8ED}
section:nth-of-type(even) .tags li{background:#F0F0F3}

/* stack */
.stack{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:28px 24px}
.stack-group h3{font:600 13px/1.3 var(--body);color:var(--muted);margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.stack-group ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.stack-group li{font-size:17px}

/* career */
.career{display:grid;grid-template-columns:1fr 300px;gap:64px}
@media (max-width:900px){.career{grid-template-columns:1fr;gap:44px}}
.timeline{list-style:none;margin:0;padding:0}
.job{display:grid;grid-template-columns:140px 1fr;gap:20px;padding:22px 0;border-bottom:1px solid var(--hair)}
.job:first-child{padding-top:0}
@media (max-width:560px){.job{grid-template-columns:1fr;gap:4px}}
.job time{font:500 14px/1.6 var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.job h3{font-size:19px;font-weight:600;margin:0;line-height:1.3;letter-spacing:-.015em}
.job .org{color:var(--brass-text);font-weight:500}
.job .place{color:var(--muted);font-size:15px}
.job p{margin:6px 0 0;font-size:16px;color:var(--muted)}
.side{display:flex;flex-direction:column;gap:36px}
.side h3{font:600 13px/1.3 var(--body);color:var(--muted);margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.side ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.side li strong{display:block;font-weight:600}
.side li span{color:var(--muted);font-size:15px}
.lang-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.meter{grid-column:1/-1;display:flex;gap:3px}
.meter i{flex:1;height:5px;border-radius:3px;background:#E3E3E8}
.meter i.on{background:var(--brass)}

/* contact */
.contact-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:end}
@media (max-width:820px){.contact-grid{grid-template-columns:1fr;gap:28px}}
.contact h2{font-size:clamp(40px,6vw,64px)}
.contact p{max-width:34em;color:var(--soft);font-size:19px;margin:16px 0 0}
.contact p.eyebrow{font-size:14px;color:var(--brass-text);margin:0 0 10px}
.channels{display:flex;flex-direction:column;background:var(--surface);border-radius:18px;padding:6px 20px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
section:nth-of-type(odd) .channels{background:var(--bg);box-shadow:none}
.channel{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 0;border-top:1px solid var(--hair)}
.channel:first-child{border-top:0}
.channel .k{font:500 13px/1 var(--body);color:var(--muted);width:76px}
.channel a,.channel .v{font-size:17px;font-weight:500;text-decoration:none;color:var(--ink);overflow-wrap:anywhere}
.channel .v{overflow-wrap:break-word}
.channel a:hover{color:var(--brass-text)}
.copy{margin-left:auto;font:500 13px/1 var(--body);background:var(--brass);color:var(--ink);border:0;padding:8px 14px;border-radius:980px;cursor:pointer}
footer{padding-block:24px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
</style>
</head>

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(lang){
  const t = I18N[lang];
  document.documentElement.lang = lang;
  document.title = t["meta.title"];
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = t[el.dataset.t]; if (v === undefined) return;
    if (el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v;
  });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));

  document.getElementById("facts").innerHTML = t.facts.map(([a,b]) => `<li><strong>${esc(a)}</strong> ${esc(b)}</li>`).join("");

  document.getElementById("activity").innerHTML = t.activity.map(x =>
    `<li class="act"><span class="org">${esc(x.org)}</span><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p><span class="status ${x.st}">${esc(x.status)}</span></li>`).join("");

  document.getElementById("services").innerHTML = t.services.map(([code,h,p]) =>
    `<article class="svc"><span class="code">${esc(code)}</span><h3>${esc(h)}</h3><p>${esc(p)}</p></article>`).join("");

  document.getElementById("projects").innerHTML = t.projects.map(p =>
    `<article class="prj" id="p-${p.id}"><div class="prj-meta"><span class="sector">${esc(p.sector)}</span><span>${esc(p.where)}</span><span>${esc(p.when)}</span></div><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p>${p.links?`<div class="links">${p.links.map(([l,h])=>`<a class="more" href="${h}" target="_blank" rel="noopener">${esc(l)} ↗</a>`).join("")}</div>`:""}<ul class="tags">${p.tags.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></article>`).join("");

  document.getElementById("stack-groups").innerHTML = t.stack.map(([h,items]) =>
    `<div class="stack-group"><h3>${esc(h)}</h3><ul>${items.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>`).join("");

  document.getElementById("timeline").innerHTML = t.jobs.map(([when,role,org,place,desc]) =>
    `<li class="job"><time>${esc(when)}</time><div><h3>${esc(role)}</h3><div><span class="org">${esc(org)}</span> <span class="place">· ${esc(place)}</span></div><p>${esc(desc)}</p></div></li>`).join("");

  document.getElementById("edu").innerHTML = t.edu.map(([a,b]) => `<li><strong>${esc(a)}</strong><span>${esc(b)}</span></li>`).join("");

  document.getElementById("langs").innerHTML = t.langs.map(([n,l,v]) =>
    `<li class="lang-row"><strong>${esc(n)}</strong><span>${esc(l)}</span><span class="meter" aria-hidden="true">${[1,2,3,4,5].map(i=>`<i class="${i<=v?"on":""}"></i>`).join("")}</span></li>`).join("");
}

function pickLang(){
  const ok = l => l && I18N[l] ? l : null;
  let q = null; try { q = new URLSearchParams(location.search).get("lang"); } catch(e){}
  const h = location.hash.replace("#","");
  let s = null; try { s = localStorage.getItem("zc-lang"); } catch(e){}
  const nav = (navigator.language || "es").slice(0,2);
  return ok(q) || ok(h) || ok(s) || ok(nav) || "es";
}

let current = pickLang();
render(current);
document.getElementById("year").textContent = new Date().getFullYear();

document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  current = b.dataset.lang; render(current);
  try { localStorage.setItem("zc-lang", current); } catch(e){}
  try { const u = new URL(location.href); u.searchParams.set("lang", current); history.replaceState(null, "", u); } catch(e){}
}));

document.getElementById("copy-mail").addEventListener("click", e => {
  const btn = e.currentTarget, addr = "hello@zeuscastillo.com";
  const done = () => { btn.textContent = I18N[current]["contact.copied"]; setTimeout(() => btn.textContent = I18N[current]["contact.copy"], 1600); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("mail")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(addr).then(done, fallback); else fallback();
});
</script>
